name: my_personal_finance_tracker
description: "Track Every Rupee. Understand Every Expense."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database (offline-first)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Security (PIN + Biometric)
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.4.0
  image_picker: ^1.1.2

  # Notifications (for daily reminders - Phase 5)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Export (Phase 4: PDF / Excel / CSV reports)
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  csv: ^6.0.0
  share_plus: ^12.0.0
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
